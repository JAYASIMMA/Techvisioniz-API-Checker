name: release

# Builds every published artifact on the operating system that can produce it:
# Windows MSIs (64- and 32-bit) on windows-latest, .deb/.rpm/AppImage on Ubuntu,
# and the macOS .app/.dmg on a macOS runner. Cross-compiling these from one host is
# not possible, which is why the matrix spans three images.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: Add the ${{ matrix.arch }} Rust target
        run: |
          if ('${{ matrix.arch }}' -eq 'x86') {
            rustup target add i686-pc-windows-msvc
          } else {
            rustup target add x86_64-pc-windows-msvc
          }

      - name: Install WiX v5 and the UI extension
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | ForEach-Object { Add-Content -Path $env:GITHUB_PATH -Value $_ }
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Tests
        run: cargo test --no-fail-fast

      - name: Build exe and MSI
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build-installer.ps1 -Arch ${{ matrix.arch }}

      - name: Checksums
        run: |
          Get-ChildItem dist/*.msi | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS-windows-${{ matrix.arch }}.txt
          Get-Content dist/SHA256SUMS-windows-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.msi
            dist/SHA256SUMS-windows-*.txt
          if-no-files-found: error

  linux:
    name: linux (deb, rpm, AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          # egui/eframe links against X11/xcb, xkbcommon and Wayland at build time.
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev \
            libfontconfig1-dev pkg-config rpm patchelf

      - name: Install appimagetool
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Tests
        run: cargo test --no-fail-fast

      - name: Build packages
        run: bash packaging/linux/build-linux-packages.sh

      - name: Checksums
        run: (cd dist/linux && sha256sum ./* > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.AppImage
            dist/linux/*.AppDir.tar.gz
            dist/linux/SHA256SUMS-linux.txt
          if-no-files-found: error

  macos:
    name: macOS (app, dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: cargo test --no-fail-fast

      - name: Build .app and .dmg (Apple Silicon + Intel, universal binary)
        run: bash packaging/macos/build-macos.sh universal

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/macos/*.dmg
            dist/macos/*.tar.gz
            dist/macos/SHA256SUMS-macos.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Combined checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*.txt' -exec sha256sum {} + | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event.inputs.draft == 'true' }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            Install Techvision API Checker for your platform below. Verify a download with:

            ```
            sha256sum -c --ignore-missing SHA256SUMS.txt      # Linux, macOS
            Get-FileHash .\Techvision-Api-Checker-*-*.msi     # Windows
            ```

            Windows: run the `-x64.msi` on any 64-bit PC (64-bit Windows installs fine on ARM too).
            Use `-x86.msi` only for a genuinely 32-bit system.

            macOS builds are unsigned and un-notarised, so right-click the app and choose **Open**
            the first time. Installers are per-user and need no administrator rights.
