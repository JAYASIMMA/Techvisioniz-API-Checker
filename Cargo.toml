[package]
name = "techvision-api-checker"
version = "1.0.1"
edition = "2021"
description = "Techvision API Checker - a Postman-style HTTP client for Windows and Linux"
authors = ["Jayasimma D <137266557+JAYASIMMA@users.noreply.github.com>"]
license = "LicenseRef-Techvision-EULA"
readme = "README.md"
homepage = "https://github.com/JAYASIMMA"
repository = "https://github.com/JAYASIMMA"
keywords = ["http", "api", "postman", "client", "gui"]
categories = ["development-tools", "network-programming"]

[[bin]]
name = "techvision-api-checker"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# Only Windows binaries need the resource compiler; a Linux build must not depend on it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true

# ---------- Linux packaging: cargo deb ----------
[package.metadata.deb]
maintainer = "Jayasimma D <137266557+JAYASIMMA@users.noreply.github.com>"
copyright = "2026 Jayasimma D"
license-file = ["LICENSE.md", "1050"]
section = "utility"
priority = "optional"
depends = "$auto"
extended-description = """\
A Postman-style HTTP client: request tabs, collections, environments with \
{{variable}} substitution, auth builders, cookie jar, response viewers, code \
generation and Postman v2.1 import/export. Settings stay on your machine."""
assets = [
    ["target/release/techvision-api-checker", "usr/bin/", "755"],
    ["packaging/linux/techvision-api-checker.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/icons/16x16/techvision-api-checker.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["packaging/linux/icons/24x24/techvision-api-checker.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["packaging/linux/icons/32x32/techvision-api-checker.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["packaging/linux/icons/48x48/techvision-api-checker.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["packaging/linux/icons/128x128/techvision-api-checker.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["packaging/linux/icons/256x256/techvision-api-checker.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

# ---------- Linux packaging: cargo generate-rpm ----------
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/techvision-api-checker", dest = "/usr/bin/techvision-api-checker", mode = "755" },
    { source = "packaging/linux/techvision-api-checker.desktop", dest = "/usr/share/applications/techvision-api-checker.desktop", mode = "644" },
    { source = "packaging/linux/icons/16x16/techvision-api-checker.png", dest = "/usr/share/icons/hicolor/16x16/apps/techvision-api-checker.png", mode = "644" },
    { source = "packaging/linux/icons/24x24/techvision-api-checker.png", dest = "/usr/share/icons/hicolor/24x24/apps/techvision-api-checker.png", mode = "644" },
    { source = "packaging/linux/icons/32x32/techvision-api-checker.png", dest = "/usr/share/icons/hicolor/32x32/apps/techvision-api-checker.png", mode = "644" },
    { source = "packaging/linux/icons/48x48/techvision-api-checker.png", dest = "/usr/share/icons/hicolor/48x48/apps/techvision-api-checker.png", mode = "644" },
    { source = "packaging/linux/icons/128x128/techvision-api-checker.png", dest = "/usr/share/icons/hicolor/128x128/apps/techvision-api-checker.png", mode = "644" },
    { source = "packaging/linux/icons/256x256/techvision-api-checker.png", dest = "/usr/share/icons/hicolor/256x256/apps/techvision-api-checker.png", mode = "644" },
    { source = "LICENSE.md", dest = "/usr/share/doc/techvision-api-checker/LICENSE.md", mode = "644", doc = true },
]
